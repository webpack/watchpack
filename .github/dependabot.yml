version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - dependencies
    versioning-strategy: widen
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - dependencies
    ignore:
      # v2 needs Changesets CLI v3, and `@changesets/cli` is still v2 here
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns:
          - "*"
